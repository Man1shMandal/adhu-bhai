<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adhu Bhai</title>

<!-- FUN FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#0e1117;
  color:#eaeaea;
  font-family:'Poppins', system-ui;
}

h2{
  margin-bottom:10px;
  font-weight:700;
  letter-spacing:.6px;
}

input,button{
  padding:14px 18px;
  font-size:16px;
  border-radius:16px;
  border:none;
  margin-top:12px;
}
button{
  background:#4fd1ff;
  cursor:pointer;
  font-weight:700;
}

/* ===== CAPSULE ===== */
.agent{
  width:320px;
  height:120px;
  background:#11151c;
  border-radius:70px;
  display:flex;
  justify-content:space-evenly;
  align-items:center;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.05),
    0 20px 45px rgba(0,0,0,.7);
}

/* ===== IMO STYLE EYES ===== */
.eye{
  width:26px;
  height:26px;
  background:#4fd1ff;
  border-radius:50%;
  transition:all .25s cubic-bezier(.2,.8,.2,1);
}

/* EXPRESSIONS */
.eye.blink{transform:scaleY(.12)}
.eye.wide{transform:scale(1.6,1.2)}
.eye.squint{transform:scale(1.5,.35)}
.eye.confident{transform:scale(1.3,.85)}
.eye.smirk{transform:scale(1.3,.6)}
.eye.side{transform:scale(1.2,1) skewX(8deg)}

/* EXCITED */
@keyframes bounce{
  0%{transform:scale(1)}
  40%{transform:scale(1.8,.85)}
  70%{transform:scale(.85,1.4)}
  100%{transform:scale(1)}
}
.eye.bounce{animation:bounce .55s infinite}

/* LAUGH */
@keyframes miniLaugh{
  0%{transform:scale(1)}
  30%{transform:scale(1.7,.8)}
  60%{transform:scale(.9,1.4)}
  100%{transform:scale(1)}
}
.eye.laugh{
  animation:miniLaugh .45s ease-in-out 2;
}

/* TEXT */
#speech{
  margin-top:20px;
  font-size:24px;
  font-weight:600;
  text-align:center;
  line-height:1.5;
  max-width:360px;
}
#weather{
  margin-top:10px;
  font-size:17px;
  font-weight:500;
  opacity:.9;
  text-align:center;
}
.weather-row{margin-top:4px}
</style>
</head>

<body>

<h2>Adhu Bhai 😏</h2>

<div class="agent">
  <div class="eye" id="eyeL"></div>
  <div class="eye" id="eyeR"></div>
</div>

<input id="city" placeholder="City ka naam bol bhidu">
<button onclick="ask()">Pooch Adhu Bhai</button>

<div id="speech">😏 Oye hero… bol na!</div>
<div id="weather"></div>

<script>
const eyeL = document.getElementById("eyeL");
const eyeR = document.getElementById("eyeR");
const speech = document.getElementById("speech");
const weatherDiv = document.getElementById("weather");

const idleLines = [
  "😏 Kya re hero… darr gaya kya?",
  "👀 Aankh mila ke bol bhidu!",
  "😆 Bore ho raha hoon, kuch pooch le",
  "🤨 City ka naam yaad aa raha hai?",
  "😌 Main yahin hoon… ignore mat kar"
];

const thinkLines = [
  "😏 Soch raha hoon… shaant reh",
  "🧠 Bhai ka dimaag full speed pe hai",
  "😆 Arre ruk… itna jaldi kya hai?"
];

let lastActive = Date.now();

/* UTILS */
function resetEyes(){
  eyeL.className="eye";
  eyeR.className="eye";
}

/* BLINK LOOP */
setInterval(()=>{
  if(Date.now()-lastActive < 2500) return;
  eyeL.classList.add("blink");
  eyeR.classList.add("blink");
  setTimeout(resetEyes,140);
},3500);

/* ===== ACTIVE IDLE BRAIN ===== */
setInterval(()=>{
  if(Date.now()-lastActive < 4000) return;

  speech.innerText = idleLines[Math.floor(Math.random()*idleLines.length)];
  resetEyes();

  const act = Math.floor(Math.random()*4);

  if(act === 0){
    // smirk
    eyeL.classList.add("smirk");
    eyeR.classList.add("smirk");
  }
  else if(act === 1){
    // wide then blink
    eyeL.classList.add("wide");
    eyeR.classList.add("wide");
    setTimeout(()=>{
      resetEyes();
      eyeL.classList.add("blink");
      eyeR.classList.add("blink");
      setTimeout(resetEyes,140);
    },400);
  }
  else if(act === 2){
    // laugh
    eyeL.classList.add("laugh");
    eyeR.classList.add("laugh");
  }
  else{
    // side look
    eyeL.classList.add("side");
    eyeR.classList.add("side");
  }

}, 5500 + Math.random()*2000);

/* APPLY AI */
function applyAI(agent, weather){
  lastActive = Date.now();
  resetEyes();

  speech.innerText = `😏 ${agent.speech}`;

  weatherDiv.innerHTML = `
    <div class="weather-row">🌡️ <b>${weather.temp}°C</b> &nbsp; | &nbsp; 💧 <b>${weather.humidity}%</b></div>
    <div class="weather-row">☁️ ${weather.condition}</div>
  `;

  if(agent.eyes==="wide"){
    eyeL.classList.add("wide");
    eyeR.classList.add("wide");
  }
  if(agent.eyes==="narrow"){
    eyeL.classList.add("squint");
    eyeR.classList.add("squint");
  }
  if(agent.emotion==="excited"){
    eyeL.classList.add("bounce");
    eyeR.classList.add("bounce");
  }
  if(agent.emotion==="confident"){
    eyeL.classList.add("confident");
    eyeR.classList.add("confident");
  }
}

/* ASK */
async function ask(){
  lastActive = Date.now();
  resetEyes();

  speech.innerText = thinkLines[Math.floor(Math.random()*thinkLines.length)];
  weatherDiv.innerHTML="";

  const city=document.getElementById("city").value.trim();
  if(!city) return;

  const r = await fetch(
    `http://127.0.0.1:8000/agent?city=${encodeURIComponent(city)}&t=${Date.now()}`
  );
  const d = await r.json();

  if(d.error){
    speech.innerText="😑 Arre bhidu… city galat dala!";
    return;
  }
  applyAI(d.agent, d.weather);
}
</script>

</body>
</html>
